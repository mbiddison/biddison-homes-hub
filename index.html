<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>BIDDISON HOMES - In-House Portal</title>
  <style>
    :root {
      --primary-navy: #1a2b4c;
      --secondary-navy: #2c3e50;
      --highlight-blue: #2980b9;
      --bg-gray: #f4f6f9;
      --card-bg: #ffffff;
      --text-dark: #2c3e50;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --input-bg: #f8fafc;
      --danger-red: #c0392b;
      --success-green: #27ae60;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-gray);
      color: var(--text-dark);
      padding-bottom: 40px;
    }

    header {
      background-color: var(--primary-navy);
      color: #ffffff;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .brand-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .brand-subtitle {
      font-size: 0.75rem;
      color: #cbd5e1;
    }

    .tab-bar {
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      background-color: var(--secondary-navy);
      -webkit-overflow-scrolling: touch;
    }

    .tab-btn {
      flex: 1;
      min-width: 90px;
      padding: 12px 8px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      border-bottom: 3px solid transparent;
    }

    .tab-btn.active {
      color: #ffffff;
      border-bottom-color: var(--highlight-blue);
      background-color: rgba(255,255,255,0.08);
    }

    .container {
      max-width: 800px;
      margin: 16px auto;
      padding: 0 12px;
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .card-title {
      font-size: 1.1rem;
      color: var(--primary-navy);
      font-weight: 700;
      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      font-size: 0.95rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background-color: var(--input-bg);
    }

    .btn-photo {
      flex: 1;
      background-color: #475569;
      color: #ffffff;
      border: none;
      padding: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      background-color: var(--primary-navy);
      color: #ffffff;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    #debug-banner {
      background-color: #fef3c7;
      border: 1px solid #f59e0b;
      color: #92400e;
      padding: 10px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 15px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-bar">
      <div>
        <div class="brand-title">BIDDISON HOMES</div>
        <div class="brand-subtitle">In-House Portal</div>
      </div>
    </div>
    
    <nav class="tab-bar">
      <button type="button" class="tab-btn active" id="tbtn-wo">Work Orders</button>
      <button type="button" class="tab-btn" id="tbtn-ji">Job Info</button>
      <button type="button" class="tab-btn" id="tbtn-sp">Site Photos</button>
      <button type="button" class="tab-btn" id="tbtn-rep">Reports</button>
      <button type="button" class="tab-btn" id="tbtn-todo">To Do List</button>
    </nav>
  </header>

  <div class="container">
    <div id="debug-banner">Status: Initializing script engine...</div>

    <!-- TAB 1: WORK ORDERS -->
    <section id="tab-work-orders" class="tab-panel active">
      <div class="card">
        <h2 class="card-title">Work Order Generator</h2>

        <form id="wo-form">
          <div class="form-group">
            <label for="wo-address-select">Job Site Address</label>
            <select id="wo-address-select" class="form-control">
              <option value="">-- Initializing list... --</option>
            </select>
          </div>

          <div class="form-group">
            <label for="wo-trade-select">Trade Partner / Subcontractor Name</label>
            <select id="wo-trade-select" class="form-control">
              <option value="">-- Initializing list... --</option>
            </select>
          </div>

          <div class="form-group">
            <label for="wo-supervisor">Supervisor</label>
            <select id="wo-supervisor" class="form-control">
              <option value="James Johnson">James Johnson</option>
              <option value="Mark Biddison">Mark Biddison</option>
            </select>
          </div>

          <div class="form-group">
            <label>Work Items</label>
            <input type="text" id="wo-item-1" class="form-control" placeholder="Item 1 instruction..." style="margin-bottom:6px;">
            <input type="text" id="wo-item-2" class="form-control" placeholder="Item 2 instruction (optional)...">
          </div>

          <div class="form-group">
            <label>Attach Work Order Photos (Optional)</label>
            <div style="display:flex; gap:10px;">
              <button type="button" id="btn-camera" class="btn-photo">📷 Take Photo (Camera)</button>
              <button type="button" id="btn-gallery" class="btn-photo">📁 Choose File / Gallery</button>
            </div>
            <input type="file" id="input-cam" accept="image/*" capture="environment" style="display:none;">
            <input type="file" id="input-gal" multiple style="display:none;">
            <div id="photo-preview-list" style="margin-top:10px;"></div>
          </div>

          <button type="submit" class="btn-submit">Generate & Send Work Order</button>
        </form>
      </div>
    </section>

    <!-- TAB 2: JOB INFO -->
    <section id="tab-job-info" class="tab-panel">
      <div class="card">
        <h2 class="card-title">Job Directory & Shared Files</h2>
        <p style="font-size:0.88rem; color:var(--text-muted);">Shared project documents from Google Drive.</p>
      </div>
    </section>

    <!-- TAB 3: SITE PHOTOS -->
    <section id="tab-site-photos" class="tab-panel">
      <div class="card">
        <h2 class="card-title">Job Site Photo Catalog</h2>
        <p style="font-size:0.88rem; color:var(--text-muted);">Site photo upload section.</p>
      </div>
    </section>

    <!-- TAB 4: REPORTS -->
    <section id="tab-reports" class="tab-panel">
      <div class="card">
        <h2 class="card-title">Automated Reports</h2>
      </div>
    </section>

    <!-- TAB 5: TO DO LIST -->
    <section id="tab-to-do" class="tab-panel">
      <div class="card">
        <h2 class="card-title">Job To-Do List</h2>
      </div>
    </section>

  </div>

  <script>
    var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxlCNcCAoUDwip0MxUeR0U-LnNjoxmZUcJH8qFBMIFUG0VEiSTQfuYT-E0CaCfTLjRP/exec";

    function updateDebug(msg) {
      var el = document.getElementById('debug-banner');
      if (el) el.innerText = "Status: " + msg;
    }

    function initTabs() {
      var tabs = [
        { btn: 'tbtn-wo', panel: 'tab-work-orders' },
        { btn: 'tbtn-ji', panel: 'tab-job-info' },
        { btn: 'tbtn-sp', panel: 'tab-site-photos' },
        { btn: 'tbtn-rep', panel: 'tab-reports' },
        { btn: 'tbtn-todo', panel: 'tab-to-do' }
      ];

      tabs.forEach(function(item) {
        var btnEl = document.getElementById(item.btn);
        if (btnEl) {
          btnEl.addEventListener('click', function() {
            document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
            document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
            document.getElementById(item.panel).classList.add('active');
            btnEl.classList.add('active');
          });
        }
      });
    }

    function initPhotoInputs() {
      var btnCam = document.getElementById('btn-camera');
      var btnGal = document.getElementById('btn-gallery');
      var inCam = document.getElementById('input-cam');
      var inGal = document.getElementById('input-gal');

      if (btnCam && inCam) btnCam.addEventListener('click', function() { inCam.click(); });
      if (btnGal && inGal) btnGal.addEventListener('click', function() { inGal.click(); });
    }

    function fetchDropdownData() {
      updateDebug("Requesting active addresses & trades from backend...");
      
      fetch(APPS_SCRIPT_URL + "?endpoint=get_lists")
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data && data.status === "success") {
            populateDropdown('wo-address-select', data.addresses || [], '-- Select Saved Job Site Address --');
            populateDropdown('wo-trade-select', data.trades || [], '-- Select Trade Partner Contractor --');
            updateDebug("Ready. Backend data connected successfully.");
          } else {
            updateDebug("Backend returned invalid response format.");
          }
        })
        .catch(function(err) {
          updateDebug("Network Error connecting to backend script. (" + err.message + ")");
        });
    }

    function populateDropdown(elemId, items, placeholderText) {
      var select = document.getElementById(elemId);
      if (!select) return;
      select.innerHTML = '<option value="">' + placeholderText + '</option>';
      items.sort().forEach(function(item) {
        var opt = document.createElement('option');
        opt.value = item;
        opt.textContent = item;
        select.appendChild(opt);
      });
    }

    window.onload = function() {
      try {
        updateDebug("Page loaded. Setting up tabs...");
        initTabs();
        initPhotoInputs();
        fetchDropdownData();
      } catch (err) {
        updateDebug("Script Initialization Crash: " + err.message);
      }
    };
  </script>
</body>
</html>
